name: Security review
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history (redacted)
        run: |
          report_dir=$(mktemp -d)
          trap 'rm -rf -- "$report_dir"' EXIT
          status=0
          docker run --rm -v "$PWD:/repo:ro" -v "$report_dir:/reports" ghcr.io/gitleaks/gitleaks:v8.24.3 git --redact=100 --no-banner --report-format json --report-path /reports/report.json /repo || status=$?
          if [ -f "$report_dir/report.json" ]; then
            python3 - "$report_dir/report.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              findings = json.load(f) or []
          from collections import Counter
          for rule, count in sorted(Counter(x.get("RuleID", "unknown") for x in findings).items()):
              print(f"Rule: {rule}; count: {count}")
          print(f"Total historical findings: {len(findings)}")
          PY
          fi
          exit "$status"
  filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Scan dependencies and configuration
        run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.58.2 fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs /repo/ShanghaiTech --skip-dirs /repo/weights --skip-dirs /repo/temo /repo
